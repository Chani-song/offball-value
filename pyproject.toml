[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "offball-value"
version = "0.1.0"
description = "Research prototype for feasible local off-ball attacker-defender games in soccer."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Chaneui Song" }
]
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "requests>=2.31",
  "pyarrow>=15.0",
  "jupyter>=1.0",
  "statsbombpy>=1.16.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
