[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "offball-value"
version = "0.1.0"
description = "Code for 'The Defender's Dilemma: Game-Theoretic Evaluation of Off-Ball Movement in Soccer' (SSAC submission)."
readme = "README.md"
requires-python = ">=3.11"
authors = [
  { name = "Kyuhyeok Seo" },
  { name = "Chan-Eui Song" },
  { name = "Andrew Kang" },
  { name = "Priya Narasimhan" },
  { name = "James Z. Wang" },
]
dependencies = [
  "numpy>=2.0",
  "pandas>=2.2",
  "scipy>=1.12",
  "matplotlib>=3.8",
  "fonttools>=4.22",
  "pyarrow>=15.0",
]

[project.optional-dependencies]
# only the pass and delivery model fitting scripts (fit_pass_candidates, train_*) and xpass modules
fit = ["scikit-learn>=1.4", "joblib>=1.3"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
